name: "luma"
arch: "amd64"
platform: "linux"
version: "${VERSION}"
section: "utils"
priority: "optional"
maintainer: "Luma Developers <contact@example.com>"
description: "Luma Application"
vendor: "Luma"
license: "MIT"
contents:
  - src: "target/x86_64-unknown-linux-gnu/release/luma"
    dst: "/usr/bin/luma"
    file_info:
      mode: 0755
  - src: "icons/icon.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/luma.png"
  - src: "AppDir/usr/share/applications/luma.desktop"
    dst: "/usr/share/applications/luma.desktop"