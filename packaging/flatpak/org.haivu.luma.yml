# Built in CI from the already-compiled binary (see the `flatpak` job).
app-id: org.haivu.luma
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: myapp
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network          # update check
  # - --filesystem=home      # uncomment if the app opens/saves user files
modules:
  - name: myapp
    buildsystem: simple
    build-commands:
      - install -Dm755 myapp /app/bin/myapp
      - install -Dm644 org.haivu.luma.desktop /app/share/applications/org.haivu.luma.desktop
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/org.haivu.luma.png
      - install -Dm644 org.haivu.luma.metainfo.xml /app/share/metainfo/org.haivu.luma.metainfo.xml
    sources:
      - { type: file, path: myapp }
      - { type: file, path: org.haivu.luma.desktop }
      - { type: file, path: icon-256.png }
      - { type: file, path: org.haivu.luma.metainfo.xml }
