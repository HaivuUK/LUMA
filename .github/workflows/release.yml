name: Build and Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create a draft release"
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Linux (x86_64) - Standard egui build + Tarball packaging
  # ---------------------------------------------------------------------------
  build-linux:
    name: Linux (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux egui Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libxinerama-dev libxkbcommon-dev \
            libgl1-mesa-dev libwayland-dev libgtk-3-dev libssl-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Tarball (Binary in bin/ for PATH usage)
        run: |
          APP_NAME="luma"
          DIST_DIR="dist-linux"
          mkdir -p ${DIST_DIR}/bin
          
          # Place binary inside bin/ so extracting to /usr/local or ~/.local puts it on PATH
          cp target/${{ matrix.target }}/release/${APP_NAME} ${DIST_DIR}/bin/
          
          tar -czvf ${APP_NAME}-${{ matrix.arch }}-linux.tar.gz -C ${DIST_DIR} bin/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/luma
            *.tar.gz

  # ---------------------------------------------------------------------------
  # Flatpak Packaging Job
  # ---------------------------------------------------------------------------
  build-flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: [build-linux]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/linux

      - name: Install Flatpak Builder & Tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common
          # Unprivileged user namespaces fix for Ubuntu 24.04 runners
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build Flatpak Bundle
        run: |
          if [ -f "packaging/linux/flatpak-bundle.sh" ]; then
            bash packaging/linux/flatpak-bundle.sh "dist/linux/luma-x86_64-linux.tar.gz"
          else
            echo "::warning::packaging/linux/flatpak-bundle.sh not found. Run custom flatpak build commands here."
          fi

      - name: Upload Flatpak Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-flatpak-${{ matrix.arch }}
          path: dist/release/*.flatpak
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # macOS Job - Runs custom build script (creates .pkg / .dmg)
  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS (${{ matrix.name }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: macos-arm64
          - target: x86_64-apple-darwin
            name: macos-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run macOS custom build script (.pkg creation)
        run: |
          chmod +x buildscripts/macOS/build-mac.sh
          ./buildscripts/macOS/build-mac.sh ${{ matrix.target }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: |
            *.pkg
            *.dmg
            target/${{ matrix.target }}/release/luma
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Windows Job
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            name: windows-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Zip Archive
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/luma.exe -DestinationPath luma-windows-x86_64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: |
            luma-windows-x86_64.zip
            target/${{ matrix.target }}/release/luma.exe
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Release Publishing
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-linux, build-flatpak, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted Version: v$VERSION"

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./downloaded-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Luma ${{ steps.get_version.outputs.VERSION }}
          draft: ${{ github.event.inputs.draft || true }}
          prerelease: false
          files: |
            ./downloaded-artifacts/**/*