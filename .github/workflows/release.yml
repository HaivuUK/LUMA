name: Build and Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create a draft release"
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Version Extraction Job
  # ---------------------------------------------------------------------------
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: get_version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved Version: $VERSION"

  # ---------------------------------------------------------------------------
  # Linux Job (deb, rpm, AppImage, tar.gz)
  # ---------------------------------------------------------------------------
  build-linux:
    name: Linux Packages (x86_64)
    needs: version
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NFPM_VERSION: "2.35.1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux egui & Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev \
            libxkbcommon-dev libgl1-mesa-dev libwayland-dev libgtk-3-dev libssl-dev \
            libasound2-dev libudev-dev rpm

      - name: Install nFPM (for .deb & .rpm)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64

      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Build .deb and .rpm Packages
        run: |
          nfpm pkg --config packaging/linux/nfpm.yaml --packager deb --target "dist/luma_${VERSION}_x86_64.deb"
          nfpm pkg --config packaging/linux/nfpm.yaml --packager rpm --target "dist/luma_${VERSION}_x86_64.rpm"

      - name: Build .AppImage Package
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/x86_64-unknown-linux-gnu/release/luma AppDir/usr/bin/luma
          
          # Create Desktop Entry
          cat << EOF > AppDir/usr/share/applications/luma.desktop
          [Desktop Entry]
          Name=Luma
          Exec=luma
          Icon=luma
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF
          
          cp AppDir/usr/share/applications/luma.desktop AppDir/luma.desktop
          ln -s usr/bin/luma AppDir/AppRun
          
          # Download AppImageTool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir "dist/luma_${VERSION}_x86_64.AppImage"

      - name: Create Linux Tarball (for Flatpak & CLI fallback)
        run: |
          mkdir -p dist-tar/bin
          cp target/x86_64-unknown-linux-gnu/release/luma dist-tar/bin/
          tar -czvf "dist/luma_${VERSION}_x86_64.tar.gz" -C dist-tar bin/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x86_64
          path: dist/*

  # ---------------------------------------------------------------------------
  # Flatpak Packaging Job
  # ---------------------------------------------------------------------------
  build-flatpak:
    name: Flatpak (x86_64)
    needs: [version, build-linux]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Linux Tarball
        uses: actions/download-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/linux

      - name: Install Flatpak Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build Flatpak Bundle
        run: |
          mkdir -p dist/release
          if [ -f "packaging/linux/flatpak-bundle.sh" ]; then
            bash packaging/linux/flatpak-bundle.sh "dist/linux/luma_${VERSION}_x86_64.tar.gz" "dist/release/luma_${VERSION}_x86_64.flatpak"
          fi

      - name: Upload Flatpak Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-flatpak-x86_64
          path: dist/release/*.flatpak
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # macOS Job
  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS (${{ matrix.name }})
    needs: version
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: arm64
          - target: x86_64-apple-darwin
            name: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build macOS Installer Package
        run: |
          chmod +x buildscripts/macOS/build-mac.sh
          ./buildscripts/macOS/build-mac.sh ${{ matrix.target }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.name }}
          path: |
            *.pkg
            *.app.tar.gz

  # ---------------------------------------------------------------------------
  # Windows Job (.msi and -setup.exe)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows (x64)
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build MSI Installer
        shell: pwsh
        run: |
          wix build packaging/windows/luma.wxs -d Version="${env:VERSION}" -o "dist/luma_${env:VERSION}_x64_en-US.msi"

      - name: Build Setup EXE Installer (NSIS)
        shell: pwsh
        run: |
          makensis /DVERSION="${env:VERSION}" packaging/windows/installer.nsi

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: dist/*

  # ---------------------------------------------------------------------------
  # GitHub Release Job
  # ---------------------------------------------------------------------------
  release:
    name: Publish Release
    needs: [version, build-linux, build-flatpak, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./downloaded-artifacts

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Luma v${{ needs.version.outputs.version }}
          draft: ${{ github.event.inputs.draft || true }}
          prerelease: false
          files: |
            ./downloaded-artifacts/**/*