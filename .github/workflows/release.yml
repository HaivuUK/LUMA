name: Build and Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create a draft release"
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: luma
  APP_DISPLAY: "LUMA"
  APP_ID: "org.haivu.luma"
  PUBLISHER: "Haivu"

jobs:
  # ---------------------------------------------------------------------------
  # Linux Job (deb, rpm, AppImage, flatpak-tarball)
  # ---------------------------------------------------------------------------
  meta:
    runs-on: ubuntu-latest
    outputs:
        version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: get_version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg n "$APP_NAME" '.packages[] | select(.name==$n) | .version')
          [ -n "$VERSION" ] || { echo "::error::package $APP_NAME not found in Cargo.toml"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Linux Job (deb, rpm, AppImage, flatpak-tarball)
  # ---------------------------------------------------------------------------
  linux:
    needs: meta
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: System build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev imagemagick

      - run: cargo build --release

      - name: Prepare icons + metainfo
        run: |
          mkdir -p target/linux dist
          convert icons/icon.png -resize 256x256 target/linux/icon-256.png
          convert icons/icon.png -resize 512x512 target/linux/icon-512.png
          sed -e "s/@VERSION@/$VERSION/" -e "s/@DATE@/$(date +%F)/" \
            "packaging/linux/$APP_ID.metainfo.xml" > "target/linux/$APP_ID.metainfo.xml"

      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --locked cargo-deb cargo-generate-rpm

      - name: .deb
        run: cargo deb --no-build -o "dist/${APP_NAME}_${VERSION}_amd64.deb"

      - name: .rpm
        run: cargo generate-rpm -o "dist/${APP_NAME}-${VERSION}-1.x86_64.rpm"

      - name: .AppImage (bundles shared libraries)
        run: |
          curl -fsSL -o /tmp/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o /tmp/linuxdeploy-plugin-appimage-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x /tmp/linuxdeploy /tmp/linuxdeploy-plugin-appimage-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1 LINUXDEPLOY_OUTPUT_VERSION="$VERSION"
          mkdir -p target/appimage && cd target/appimage
          /tmp/linuxdeploy --appdir AppDir \
            --executable "../release/$APP_NAME" \
            --desktop-file "../../packaging/linux/$APP_ID.desktop" \
            --icon-file ../linux/icon-256.png --icon-filename "$APP_NAME" \
            --output appimage
          mv ./*.AppImage "../../dist/$APP_NAME-$VERSION-x86_64.AppImage"

      - name: Stage files for the flatpak job
        run: |
          S=target/flatpak; mkdir -p $S
          cp "target/release/$APP_NAME" $S/
          cp target/linux/icon-256.png $S/
          cp "target/linux/$APP_ID.metainfo.xml" $S/
          sed "s|^Icon=.*|Icon=$APP_ID|" "packaging/linux/$APP_ID.desktop" > "$S/$APP_ID.desktop"
          cp "packaging/flatpak/$APP_ID.yml" $S/

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-linux
          path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-stage
          path: target/flatpak/

  # ---------------------------------------------------------------------------
  # Flatpak Job
  # ---------------------------------------------------------------------------
  flatpak:
    needs: [ meta, linux ]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: flatpak-stage
          path: stage
      - run: chmod +x stage/${{ env.APP_NAME }}
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.APP_NAME }}-${{ needs.meta.outputs.version }}-x86_64.flatpak
          manifest-path: stage/${{ env.APP_ID }}.yml
          arch: x86_64
          cache-key: flatpak-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-flatpak
          path: "*.flatpak"

  # ---------------------------------------------------------------------------
  # macOS Job (.pkg, .dmg, .app.tar.gz)
  # ---------------------------------------------------------------------------
  macos:
    needs: meta
    runs-on: macos-14
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # All optional. Without them you get ad-hoc signed, un-notarized builds.
#      APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}        # .p12 containing both Developer ID certs
#      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
#      SIGN_APP_ID: ${{ secrets.APPLE_APP_IDENTITY }}             # "Developer ID Application: Name (TEAMID)"
#      SIGN_PKG_ID: ${{ secrets.APPLE_PKG_IDENTITY }}             # "Developer ID Installer: Name (TEAMID)"
#      NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
#      NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
#      NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}         # app-specific password
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build (arm64 + x86_64) and merge to universal
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output "target/universal/$APP_NAME" \
            "target/aarch64-apple-darwin/release/$APP_NAME" \
            "target/x86_64-apple-darwin/release/$APP_NAME"

      - name: Import signing certificate
        if: env.APPLE_CERT_BASE64 != ''
        run: |
          echo "$APPLE_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - run: brew install create-dmg

      - name: Package (.app.zip, .dmg, .pkg)
        run: bash packaging/macos/build-macos.sh "$VERSION" "target/universal/$APP_NAME" dist

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-macos
          path: dist/*

  # ---------------------------------------------------------------------------
  # Windows Job (.msi and -setup.exe)
  # ---------------------------------------------------------------------------
  windows:
    needs: meta
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      # Statically link the MSVC runtime: no VC++ redistributable needed on the user's PC.
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release

      - name: Installer (.exe, Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc `
            "/DAppName=$env:APP_DISPLAY" "/DAppExeName=$env:APP_NAME.exe" `
            "/DAppVersion=$env:VERSION" "/DAppPublisher=$env:PUBLISHER" `
            "/DSourceExe=$PWD\target\release\$env:APP_NAME.exe" `
            "/DOutputName=$env:APP_NAME-$env:VERSION-x86_64-setup" `
            packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installer (.msi, WiX)
        run: |
          pwsh packaging/windows/license-to-rtf.ps1 LICENSE.txt target/LICENSE.rtf
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          $msiVersion = $env:VERSION.Split('-')[0]   # MSI versions must be numeric
          New-Item -ItemType Directory -Force dist | Out-Null
          wix build packaging/windows/main.wxs -arch x64 -ext WixToolset.UI.wixext `
            -d "AppName=$env:APP_DISPLAY" -d "Publisher=$env:PUBLISHER" -d "Version=$msiVersion" `
            -d "ExePath=target\release\$env:APP_NAME.exe" -d "IconPath=icons\icon.ico" `
            -d "LicenseRtf=target\LICENSE.rtf" `
            -o "dist\$env:APP_NAME-$env:VERSION-x86_64.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-windows
          path: dist/*

  # ---------------------------------------------------------------------------
  # GitHub Release Job
  # ---------------------------------------------------------------------------
  release:
    needs: [ meta, macos, windows, linux, flatpak ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS.txt && ls -l
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: v${{ needs.meta.outputs.version }}
          draft: true
          generate_release_notes: true
          files: dist/*