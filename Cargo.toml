[package]
name = "luma"
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Rust tool to assign bone material properties to finite element meshes from CT data"
repository = "https://github.com/INSIGNEO/LUMA"
authors = ["George Allison", "Haivu"]
license-file = "LICENSE"

[package.metadata.dist]

[package.metadata.wix]
upgrade-guid = "85513B88-8E2B-4588-8EFA-26DC9D0455A0"
path-guid = "666954E5-187F-4865-A5DC-B66B0EE47F20"
license = true
eula = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
log = "0.4"
env_logger = "0.11"
rayon = "1"
vtkio = "0.7.0-rc2" # Using the rc to fix the lz4 vulnerbility
dicom-object = "0.10"
dicom-pixeldata = "0.10"
regex = "1"
lazy_static = "1"
once_cell = "1"
indicatif = "0.18"
palette = "0.7"
bytemuck = { version = "1", features = ["derive"] }
bevy = { version = "0.20", default-features = false, features = [
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_image",
    "bevy_light",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_picking",
    "bevy_render",
    "bevy_shader",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "multi_threaded",
    "png",
    "tonemapping_luts",
    "wayland",
    "x11",
]}
bevy_egui = { version = "0.43", default-features = false, features = [
    "default_fonts",
    "manage_clipboard",
    "open_url",
    "render",
]}
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
nifti = { version = "0.18", features = ["ndarray_volumes", "nalgebra_affine"] }
nalgebra = "0.35" # NIfTI package limits us to 0.35
flate2 = "1"
bzip2 = "0.6"
ureq = { version = "3", default-features = false, features = ["json"] }
semver = "1"
open = "5"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[build-dependencies]
winresource = "0.1"

[[bin]]
name = "luma"
path = "src/main.rs"

[[example]]
name = "test_logging"
path = "examples/test_logging.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# ------------------------------------------------------------------ .deb
[package.metadata.deb]
name = "luma"
maintainer = "George Allison <george.allison@example.com>"
copyright = "2026, George Allison"
license-file = ["LICENSE.txt", "0"]
extended-description = "Longer description of My App."
section = "utils"
priority = "optional"
# $auto = libs found via ldd (libasound2, libudev1, ...); the rest are dlopen()ed by winit/wgpu
depends = "$auto, libvulkan1, libx11-6, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0"
assets = [
    ["target/release/luma", "usr/bin/", "755"],
    ["packaging/linux/org.haivu.luma.desktop", "usr/share/applications/", "644"],
    ["target/linux/icon-256.png", "usr/share/icons/hicolor/256x256/apps/luma.png", "644"],
    ["target/linux/icon-512.png", "usr/share/icons/hicolor/512x512/apps/luma.png", "644"],
    ["target/linux/org.haivu.luma.metainfo.xml", "usr/share/metainfo/", "644"],
]

# ------------------------------------------------------------------ .rpm
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/luma", dest = "/usr/bin/luma", mode = "0755" },
    { source = "packaging/linux/org.haivu.luma.desktop", dest = "/usr/share/applications/org.haivu.luma.desktop", mode = "0644" },
    { source = "target/linux/icon-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/luma.png", mode = "0644" },
    { source = "target/linux/icon-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/luma.png", mode = "0644" },
    { source = "target/linux/org.haivu.luma.metainfo.xml", dest = "/usr/share/metainfo/org.haivu.luma.metainfo.xml", mode = "0644" },
    { source = "LICENSE.txt", dest = "/usr/share/licenses/luma/LICENSE.txt", mode = "0644" },
]
[package.metadata.generate-rpm.requires]
alsa-lib = "*"
systemd-libs = "*"
vulkan-loader = "*"
libxkbcommon = "*"
libwayland-client = "*"
libX11 = "*"
